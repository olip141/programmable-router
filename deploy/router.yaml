# Example policy for edge-router (GNS3 forward path).
nftables:
  table: dpi
  hooks: [forward]
  drop_mark: 0xdead
  element_timeout: 300s

qos:
  enabled: true
  # name: wan | lan | auto | interface name (wan = interface with the default route)
  interfaces:
    - { name: wan, rate: 100mbit }
  classes:
    - { name: video-low-prio, mark: 0x10, rate: 2mbit, prio: 5 }
    - { name: ssh-high-prio, mark: 0x20, rate: 3mbit, prio: 2 }
    - { name: youtube-alt-wan, mark: 0x30, rate: 1mbit, prio: 4 }

routing:
  enabled: false
  routes: null

rules:
  - name: block-torrent
    match: { protocol: BitTorrent }
    action: drop

  - name: video-low-prio
    match: { category: Media }
    action: mark
    mark: 0x10

  - name: ssh-high-prio
    match: { master: SSH }
    action: mark
    mark: 0x20

  - name: youtube-alt-wan
    match: { app: YouTube }
    action: mark
    mark: 0x30
